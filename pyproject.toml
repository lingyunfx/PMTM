[project]
name = "pmtm"
version = "1.9.0"
description = "PM TimeMachine，为视效行业制片准备的小工具集"
readme = "readme.md"
requires-python = ">=3.10,<3.11"
license = { file = "LICENSE" }
dependencies = [
    "dayu-path==0.5.2",
    "dayu-widgets==0.13.15",
    "openpyxl==3.1.5",
    "pillow==11.2.1",
    "pymiere==1.4.1",
    "PySide2==5.15.2.1",
]

[project.urls]
Homepage = "https://github.com/lingyunfx/PMTM"
Documentation = "https://lingyunfx.com/pmtm-doc/"

[project.scripts]
pmtm = "pmtm:run"

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
    "types-pyside2==5.15.2.1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pmtm"]
