[project]
name = "pmtm"
dynamic = ["version"]
description = "PM TimeMachine，为视效行业制片准备的小工具集"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { file = "LICENSE" }
dependencies = [
    "dayu-path==0.5.2",
    "dayu-widgets==0.13.15",
    "openpyxl==3.1.5",
    "pillow==11.2.1",
    "pymiere==1.4.1",
    "PySide2==5.15.2.1",
]

[project.urls]
Homepage = "https://github.com/lingyunfx/PMTM"
Documentation = "https://lingyunfx.com/pmtm-doc/"

[project.scripts]
pmtm = "pmtm:run"

[dependency-groups]
dev = [
    "nuitka>=4.3.3",
    "ordered-set>=4.1",
    "zstandard>=0.23",
    "types-pyside2==5.15.2.1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# 版本号只维护 pmtm/constant.py 一处，这里动态读取
path = "pmtm/constant.py"

[tool.hatch.build.targets.wheel]
packages = ["pmtm"]
